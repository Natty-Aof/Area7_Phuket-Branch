<!DOCTYPE html>
<html lang="th">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แคตตาล็อกรถตามสภาพ — Beyond Green</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1f17; --bg2:#13291f; --card:#183326; --line:#2a4a3a; --ink:#eef5f0; --mute:#9db8a9;
  --acc:#7fd19b; --acc2:#c9a54a; --rent:#6cb6e8; --warn:#e8a25c; --bad:#e07a6c;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(13,31,23,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1200px;margin:0 auto;padding:12px 16px 10px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;letter-spacing:.2px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.roles{margin-left:auto;display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px}
.roles button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13px;color:var(--mute)}
.roles button.on{background:var(--acc);color:#0d1f17;font-weight:600}
.kpis{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:12px;color:var(--mute)}
.kpi b{display:block;font-size:18px;color:var(--ink)}
.kpi.g b{color:var(--acc)}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{flex:1;min-width:180px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--mute)}
.chip.on{border-color:var(--acc);color:var(--acc);background:rgba(127,209,155,.1)}
main{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--acc)}
.ph{aspect-ratio:4/3;background:#0f2419;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.noimg{color:var(--mute);font-size:12px;text-align:center;padding:10px}
.noimg svg{display:block;margin:0 auto 6px;opacity:.5}
.ph .cnt{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);border-radius:6px;font-size:11px;padding:2px 6px}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cn{font-weight:700;font-size:16px;line-height:1.25}
.cat{font-size:12px;color:var(--mute)}
.avail{display:flex;align-items:baseline;gap:6px}
.avail b{font-size:26px;color:var(--acc);line-height:1}
.avail.zero b{color:var(--bad)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11.5px;border-radius:6px;padding:2px 7px;font-weight:600}
.t-sale{background:rgba(201,165,74,.16);color:var(--acc2)}
.t-rent{background:rgba(108,182,232,.15);color:var(--rent)}
.t-hold{background:rgba(224,122,108,.15);color:var(--bad)}
.t-mute{background:rgba(157,184,169,.12);color:var(--mute);font-weight:500}
.price{font-size:13.5px;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
.price div{display:flex;justify-content:space-between;gap:8px}
.price .lbl{color:var(--mute)}
.price .v{font-weight:600}
.price .na{color:var(--mute);font-weight:400;font-style:italic}
.empty{padding:40px;text-align:center;color:var(--mute)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.ov.on{display:block}
.sheet{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;transform:translateX(100%);transition:transform .22s}
.sheet.on{transform:none}
.sh{position:sticky;top:0;background:rgba(13,31,23,.97);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;z-index:2}
.sh h2{margin:0;font-size:19px;flex:1}
.btn{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:7px 12px;font-size:13.5px}
.btn.pri{background:var(--acc);color:#0d1f17;border-color:var(--acc);font-weight:600}
.btn.gold{background:var(--acc2);color:#1a1405;border-color:var(--acc2);font-weight:600}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.dng{color:var(--bad)}
.sbody{padding:16px;display:flex;flex-direction:column;gap:16px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gal .g{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#0f2419;border:1px solid var(--line)}
.gal img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.gal .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);border:0;border-radius:6px;color:#fff;font-size:12px;padding:2px 7px}
.hero{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#0f2419;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.hero img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.box h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.box h3 .sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.st{background:var(--bg2);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--mute)}
.st b{display:block;font-size:20px;color:var(--ink)}
.st.g b{color:var(--acc)}
.bigp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigp .p{background:var(--bg2);border-radius:10px;padding:10px 12px}
.bigp .p .l{font-size:12px;color:var(--mute)}
.bigp .p .n{font-size:20px;font-weight:700}
.bigp .p.s .n{color:var(--acc2)} .bigp .p.r .n{color:var(--rent)}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.frm label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.frm input,.frm select,.frm textarea,.inp{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.frm .full{grid-column:1/-1}
.units{display:flex;flex-direction:column;gap:10px}
.unit{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:96px 1fr;gap:10px}
.unit .uph{aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:#0f2419;display:flex;align-items:center;justify-content:center}
.unit .uph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.unit .ut{font-weight:600}
.unit .um{font-size:12.5px;color:var(--mute)}
.unit .uact{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.grade{display:inline-block;min-width:22px;text-align:center;border-radius:6px;font-weight:700;font-size:12px;padding:1px 6px;margin-right:4px}
.gA{background:#2f6b45;color:#d6f5e0}.gB{background:#6b5a2f;color:#f5ead6}.gC{background:#6b3a2f;color:#f5ddd6}
.note{font-size:12.5px;color:var(--mute)}
.warnbox{background:rgba(232,162,92,.1);border:1px solid rgba(232,162,92,.35);color:#f2c896;border-radius:10px;padding:10px 12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0a1712;border:1px solid var(--acc);color:var(--ink);padding:10px 16px;border-radius:10px;z-index:90;font-size:14px;display:none;max-width:90vw}
.toast.on{display:block}.toast.err{border-color:var(--bad)}
/* present */
.pres{position:fixed;inset:0;background:#06100b;z-index:80;display:none;flex-direction:column}
.pres.on{display:flex}
.pimg{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.pimg img{max-width:100%;max-height:100%;object-fit:contain}
.pnav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:0;color:#fff;font-size:28px;width:48px;height:48px;border-radius:50%}
.pnav.l{left:12px}.pnav.r{right:12px}
.pdots{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:#cfe}
.pinfo{padding:18px 22px 22px;background:linear-gradient(0deg,#0d1f17,#0b1a13);border-top:1px solid var(--line)}
.pinfo h1{margin:0;font-size:clamp(22px,4vw,34px)}
.pinfo .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;align-items:stretch}
.pinfo .pp{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 16px}
.pinfo .pp .l{font-size:13px;color:var(--mute)}
.pinfo .pp .n{font-size:clamp(20px,3.2vw,28px);font-weight:700}
.pinfo .pp.s .n{color:var(--acc2)}.pinfo .pp.r .n{color:var(--rent)}.pinfo .pp.a .n{color:var(--acc)}
.pclose{position:absolute;top:12px;right:12px;z-index:3}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:95;display:none;align-items:center;justify-content:center}
.lb.on{display:flex}.lb img{max-width:96vw;max-height:94vh}
.foot{max-width:1200px;margin:0 auto;padding:6px 16px 30px;color:var(--mute);font-size:12px}
.spec{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:6px 12px;font-size:14px}
.spec .k{color:var(--mute)}.spec .v{font-weight:500}
.gal .cap{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.65);border-radius:5px;font-size:11px;padding:1px 6px}
.defs{display:flex;flex-direction:column;gap:8px}
.def{display:grid;grid-template-columns:84px 1fr;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px}
.def.fixed{opacity:.6}
.def .dph{aspect-ratio:1;border-radius:8px;overflow:hidden;background:#0f2419;display:flex;align-items:center;justify-content:center}
.def .dph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.t-ok{background:rgba(127,209,155,.15);color:var(--acc)}
.t-warn{background:rgba(232,162,92,.15);color:var(--warn)}
.lv-minor{background:rgba(157,184,169,.15);color:var(--mute)}.lv-mid{background:rgba(232,162,92,.15);color:var(--warn)}.lv-major{background:rgba(224,122,108,.18);color:var(--bad)}
textarea.paste{min-height:140px;font-family:ui-monospace,monospace;font-size:12px}
@media(max-width:560px){.roles{margin-left:0;width:100%}.roles button{flex:1}.bigp{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr;gap:10px}.cn{font-size:14px}.avail b{font-size:22px}.cb{padding:10px}}

.brand{font-size:24px}.brand small{font-size:15px;margin-top:2px}
.kpis{gap:10px}.kpi{font-size:15px;padding:8px 16px;border-radius:12px}.kpi b{font-size:26px}
.kpi.rv{border-color:rgba(214,178,94,.55);cursor:pointer}.kpi.rv b{color:#e6c77a}.kpi.rv.on{background:rgba(214,178,94,.14)}
.tools input[type=search]{font-size:16px;padding:11px 14px}
.chip{font-size:15px;padding:7px 15px}
.chip.rv.on{border-color:#d6b25e;color:#e6c77a;background:rgba(214,178,94,.14)}
@media(max-width:560px){.brand{font-size:20px}.kpi{flex:1;min-width:30%;padding:8px 10px;font-size:13px}.kpi b{font-size:22px}.chip{font-size:14px;padding:7px 12px}}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="top">
    <div class="brand">แคตตาล็อกรถตามสภาพ<small id="asof">Beyond Green · กำลังโหลดข้อมูล…</small></div>
    <div class="roles" id="roles" style="display:none"></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="ค้นหารุ่น เช่น Precedent, 4 ที่นั่ง, Carryall">
    <div class="chips" id="cats"></div>
  </div>
  <div class="tools"><div class="chips" id="offers"></div><div class="chips" id="sorts" style="margin-left:auto"></div></div>
</div></header>

<main>
  <div id="accPanel" style="display:none;margin-bottom:16px"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"></div>
</main>
<div class="foot">ตัวอย่างสำหรับนำเสนอ (Demo) · ตัวเลขสต๊อกจริงจากรายงาน HQ ณ 8 พ.ย. 2569 · ราคาขายและรถรายคันเป็นข้อมูลทดสอบ · รูปจาก Club Car</div>

<div class="ov" id="ov"></div>
<aside class="sheet" id="sheet"></aside>
<div class="pres" id="pres"></div>
<div class="lb" id="lb"><img id="lbimg" alt=""></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>

<script>
(() => {
const S = { db:null, assets:null, models:{}, units:{}, meta:{}, role:"sales", q:"", cat:"all", offer:"all", sort:"order", open:null, loaded:false };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n = v => Number(v) || 0;
const fmt = v => n(v).toLocaleString("th-TH");
const baht = v => n(v) ? "฿" + fmt(v) : "";
const img = id => "img/" + encodeURIComponent(id) + ".jpg";
const CATS = [["all","ทั้งหมด"],["2","2 ที่นั่ง"],["4","4 ที่นั่ง"],["6","6–8 ที่นั่ง"],["util","อเนกประสงค์/บรรทุก"],["other","อื่นๆ"]];
const OFFERS = {both:"ขาย / เช่า", sale:"ขายเท่านั้น", rent:"เช่าเท่านั้น", hold:"ยังไม่เปิดขาย/เช่า"};
const USTATUS = {ready:"พร้อมส่งมอบ", repair:"รอซ่อม/เตรียมรถ", reserved:"จองแล้ว", sold:"ขาย/ปล่อยเช่าแล้ว"};
const LOCS = ["คลัง (สำนักงาน)","รถฝากจอด","Global House","สาขาภูเก็ต","สาขาสมุย","สาขาหาดใหญ่","สาขากระบี่","อื่นๆ"];
const noImg = (t="ยังไม่มีรูป") => `<div class="noimg"><svg width="46" height="34" viewBox="0 0 46 34" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="38" height="18" rx="3"/><path d="M8 22v6M38 22v6M2 4h42"/><circle cx="12" cy="29" r="3"/><circle cx="34" cy="29" r="3"/></svg>${t}</div>`;

function catOf(name){
  const u = (name||"").toUpperCase();
  if (u.includes("CARRYALL")) return "util";
  if (u.includes("2+2")) return "4";
  const m = u.match(/(\d)\s*SEATER/); if(!m) return "other";
  const s = +m[1]; return s===2?"2":s===4?"4":s>=6?"6":"other";
}
const catLabel = c => (CATS.find(x=>x[0]===c)||[,"อื่นๆ"])[1];
function slug(name){
  let s = String(name).replace(/ชุดยกสูง/g," lifted ").replace(/โฉมใหม่/g," new ").toLowerCase().replace(/\+/g,"p");
  const rest = s.replace(/[a-z0-9\s-]/g,"");
  s = s.replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  if (rest.trim()) { let h=0; for (const ch of rest) h=(h*31+ch.charCodeAt(0))>>>0; s += "-" + h.toString(36); }
  return s || "m-" + Date.now().toString(36);
}
function toast(msg, err){ const t=$("#toast"); t.textContent=msg; t.className="toast on"+(err?" err":""); clearTimeout(t._h); t._h=setTimeout(()=>t.className="toast",2600); }
function dbErr(e){ console.error(e); toast(e && e.code==="invalid_argument" ? "บันทึกไม่ได้ — บัญชีนี้ไม่มีสิทธิ์แก้ไข" : "บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง", true); }

// --- derived
function unitsOf(id){ return Object.values(S.units).filter(u=>u.modelId===id).sort((a,b)=>(a.serial||"").localeCompare(b.serial||"")); }
function photoList(u){ return (u&&u.photos||[]).map(p=>typeof p==="string"?{id:p,tag:""}:p).filter(p=>p&&p.id); }
function photosOf(m){ const ps=[...(m.photos||[])]; for(const u of unitsOf(m._id)) for(const p of photoList(u)) ps.push(p.id); return ps; }
const TAGS=["ด้านหน้า","ด้านหลัง","ด้านซ้าย","ด้านขวา","เบาะ/ห้องโดยสาร","หน้าปัด/พวงมาลัย","แบตเตอรี่","ชาร์จเจอร์","ยาง/ล้อ","หลังคา","อื่นๆ"];
const LEVELS={minor:"เล็กน้อย",mid:"ปานกลาง",major:"ต้องซ่อม"};
function priceOfUnit(u,m){ return n(u.salePrice)||n(m.salePriceMin)||0; }
function batSummary(u){ return [u.batType, u.voltage, u.batCount&&(u.batCount+" ลูก"), u.batSpec, u.batYear&&("ติดตั้งปี "+u.batYear), u.batHealth&&("สุขภาพ "+u.batHealth+"%")].filter(Boolean).join(" · "); }
function offerOf(m){ return m.offer || "both"; }
function canSale(m){ const o=offerOf(m); return o==="both"||o==="sale"; }
function canRent(m){ const o=offerOf(m); return o==="both"||o==="rent"; }
function salePriceText(m){
  const a=n(m.salePriceMin), b=n(m.salePriceMax);
  if(!a&&!b) return "";
  if(a&&b&&a!==b) return baht(a)+" – "+baht(b);
  return baht(a||b);
}
function rentText(m){ return n(m.rentPrice) ? baht(m.rentPrice)+" /เดือน" : ""; }

// --- header
function renderHead(){
  $("#asof").textContent = "Beyond Green · ข้อมูล ณ " + (S.meta.asOf || "—");
  const ms = Object.values(S.models);
  const tot = ms.reduce((a,m)=>a+n(m.total),0), po = ms.reduce((a,m)=>a+n(m.poTotal),0), av = ms.reduce((a,m)=>a+n(m.avail),0);
  const priced = ms.filter(m=>n(m.avail)>0 && (salePriceText(m)||rentText(m))).length, withAvail = ms.filter(m=>n(m.avail)>0).length;
  const withPh = ms.filter(m=>n(m.avail)>0 && photosOf(m).length).length;
  $("#kpis").innerHTML = `
    <div class="kpi g"><b>${fmt(av)}</b>คัน ขาย/เช่าได้</div>
    <div class="kpi"><b>${fmt(po)}</b>คัน มี PO แล้ว</div>
    <div class="kpi"><b>${fmt(tot)}</b>คัน สต๊อกทั้งหมด</div>
    <div class="kpi rv ${S.offer==="rsv"?"on":""}" data-offer="rsv"><b>${rsvTotal()}</b>🔒 คัน กำลังจอง</div>
    ${S.role!=="sales"?`<div class="kpi"><b>${priced}/${withAvail}</b>รุ่นที่ใส่ราคาแล้ว</div><div class="kpi"><b>${withPh}/${withAvail}</b>รุ่นที่มีรูปแล้ว</div>`:""}`;
  $("#cats").innerHTML = CATS.map(([k,l])=>`<button class="chip ${S.cat===k?"on":""}" data-cat="${k}">${l}</button>`).join("");
  $("#offers").innerHTML = [["all","ขาย+เช่า ทั้งหมด"],["sale","ขายได้"],["rent","เช่าได้"],["rsv","🔒 กำลังจอง"]].map(([k,l])=>`<button class="chip ${k==="rsv"?"rv ":""}${S.offer===k?"on":""}" data-offer="${k}">${l}</button>`).join("");
  $("#sorts").innerHTML = [["order","เรียงตามรายงาน"],["avail","คงเหลือมากสุด"]].map(([k,l])=>`<button class="chip ${S.sort===k?"on":""}" data-sort="${k}">${l}</button>`).join("");
}

// --- grid
function renderGrid(){
  let ms = Object.values(S.models);
  const q = S.q.trim().toLowerCase();
  if (q) ms = ms.filter(m => (m.name+" "+catLabel(m.cat)+" "+(m.desc||"")).toLowerCase().includes(q));
  if (S.cat!=="all") ms = ms.filter(m=>m.cat===S.cat);
  if (S.offer==="sale") ms = ms.filter(canSale);
  if (S.offer==="rent") ms = ms.filter(canRent);
  if (S.offer==="rsv") ms = ms.filter(m=>rsvCount(unitsOf(m._id)).a>0);
  if (S.role==="sales") ms = ms.filter(m=>n(m.avail)>0 && offerOf(m)!=="hold");
  ms.sort(S.sort==="avail" ? (a,b)=>n(b.avail)-n(a.avail) : (a,b)=>n(a.order)-n(b.order));
  const g=$("#grid"), e=$("#empty");
  if (!S.loaded){ g.innerHTML=""; e.style.display="block"; e.textContent="กำลังโหลดข้อมูล…"; return; }
  if (!ms.length){ g.innerHTML=""; e.style.display="block"; e.textContent = S.offer==="rsv" ? "ตอนนี้ยังไม่มีรถที่กำลังจอง" : Object.keys(S.models).length ? "ไม่พบรุ่นที่ตรงกับตัวกรอง" : "ยังไม่มีข้อมูลสต๊อก — ไปที่โหมด 'บัญชี' เพื่อวางตารางสต๊อก"; return; }
  e.style.display="none";
  g.innerHTML = ms.map(m=>{
    const ps = photosOf(m), us = unitsOf(m._id), o = offerOf(m);
    const st = salePriceText(m), rt = rentText(m);
    return `<article class="card" data-open="${esc(m._id)}">
      <div class="ph">${ps.length?`<img loading="lazy" src="${img(ps[0])}" alt="">`:noImg()}${ps.length>1?`<span class="cnt">${ps.length} รูป</span>`:""}</div>
      <div class="cb">
        <div class="cn">${esc(m.name)}</div>
        <div class="cat">${catLabel(m.cat)}${us.length?` · ลงข้อมูลรายคัน ${us.length} คัน`:""}${rsvCount(us).a?` · <span style="color:#e6c77a">🔒 จองอยู่ ${rsvCount(us).a} คัน</span>`:""}</div>
        <div class="avail ${n(m.avail)?"":"zero"}"><b>${fmt(m.avail)}</b><span class="note">คันพร้อมขาย/เช่า</span></div>
        <div class="tags">${o==="hold"?`<span class="tag t-hold">ยังไม่เปิด</span>`:""}${canSale(m)?`<span class="tag t-sale">ขายได้</span>`:""}${canRent(m)?`<span class="tag t-rent">เช่าได้</span>`:""}${n(m.consign)?`<span class="tag t-mute">ฝากจอด ${fmt(m.consign)}</span>`:""}</div>
        <div class="price">
          ${canSale(m)?`<div><span class="lbl">ราคาขาย</span><span class="v">${st||'<span class="na">สอบถามบัญชี</span>'}</span></div>`:""}
          ${canRent(m)?`<div><span class="lbl">ค่าเช่า</span><span class="v">${rt||'<span class="na">เซลล์เสนอตามเรตเช่า</span>'}</span></div>`:""}
        </div>

  }).join("");
}

      <textarea class="inp paste" id="impText" placeholder="PRECEDENT 2 SEATER\t522\t15\t183\t92\t290\t52\t180\t\t232"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center"><button class="btn pri" id="impGo">ตรวจสอบและนำเข้า</button><span class="note" id="impMsg"></span></div>
    </div></div>`;
}
function parseStock(txt){
  const rows=[], errs=[];
  txt.split(/\r?\n/).forEach((line,i)=>{
    if(!line.trim()) return;
    const c = line.split("\t"); if (c.length<2){ errs.push(`แถว ${i+1}: ไม่ใช่ข้อมูลที่คั่นด้วย Tab`); return; }
    const name=c[0].trim(); if(!name || /grand\s*total/i.test(name) || name==="รุ่นรถ") return;
    const v = k => n(String(c[k]||"").replace(/,/g,""));
    const r = {name,total:v(1),poSale:v(2),poRent:v(3),poCon:v(4),poTotal:v(5),wh:v(6),consign:v(7),gh:v(8),avail:v(9)};
    if (c.length<10) r.avail = r.total - r.poTotal;
    rows.push(r);
  });
  return {rows,errs};
}
async function doImport(){
  const {rows,errs}=parseStock($("#impText").value), msg=$("#impMsg");
  if (errs.length){ msg.textContent=errs.slice(0,3).join(" · "); return; }
  if (!rows.length){ msg.textContent="ไม่พบข้อมูล"; return; }
  if (!S.db){ msg.textContent="ฐานข้อมูลไม่พร้อม"; return; }
  msg.textContent=`กำลังนำเข้า ${rows.length} รุ่น…`;
  try{
    const seen=new Set();
    for (let i=0;i<rows.length;i++){
      const r=rows[i], id=slug(r.name); seen.add(id);
      const ref=S.db.collection("models").doc(id), ex=S.models[id];
      const body={...r,cat:catOf(r.name),order:i};
      if (ex) await ref.update(body); else await ref.set({...body,offer:"both",photos:[]});
    }
    for (const id of Object.keys(S.models)) if(!seen.has(id) && (n(S.models[id].total)||n(S.models[id].avail))) await S.db.collection("models").doc(id).update({total:0,poSale:0,poRent:0,poCon:0,poTotal:0,wh:0,consign:0,gh:0,avail:0});
    const d=$("#impDate").value.trim(); if(d) await S.db.doc("meta/info").set({...S.meta,asOf:d});
    msg.textContent=`นำเข้าแล้ว ${rows.length} รุ่น`; toast("อัปเดตสต๊อกเรียบร้อย");
  }catch(e){ dbErr(e); msg.textContent=""; }
}

// ---- การจอง (เดโม: เก็บในเครื่องผู้ใช้)
const RSV_DAYS=7, RSV_KEY="bg-rsv-demo-v1", DAY=86400000, RSV_API="https://script.google.com/macros/s/AKfycbznNTjsowwaFRhJ_2VwXxWdni4cBcyCYtbtngBOcipXwUF3ASrbP0oFhQ_ZsGCCrE6xaQ/exec";
let RSV={};
(function(){ const now=Date.now();
  const seed={"demo-precedent-4-seater-1":{by:"เซลล์ภูเก็ต A",cust:"รีสอร์ท ก.",at:now-2*DAY,exp:now+5*DAY},
              "demo-ds-2-seater-1":{by:"เซลล์สมุย B",cust:"สนามกอล์ฟ ข.",at:now-6*DAY,exp:now+1*DAY-3600000},
              "test-2":{by:"เซลล์กระบี่ C",cust:"โรงแรม ค.",at:now-9*DAY,exp:now-2*DAY}};
  let saved=null; try{ saved=JSON.parse(localStorage.getItem(RSV_KEY)||"null"); }catch(_){}
  RSV = saved || seed;
})();
function saveRsv(){ try{ localStorage.setItem(RSV_KEY,JSON.stringify(RSV)); }catch(_){} }
function rsvOf(id){ const r=RSV[id]; if(!r) return null; if(r.closed) return {...r,state:"closed"}; if(Date.now()>r.exp) return {...r,state:"expired"}; return {...r,state:"active",left:Math.ceil((r.exp-Date.now())/DAY)}; }
const dTH = t => new Date(t).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"});
function rsvTag(u){ const r=rsvOf(u._id); if(!r) return "";
  if(r.state==="active") return `<span class="tag" style="background:rgba(214,178,94,.18);color:#e6c77a;border:1px solid rgba(214,178,94,.45)">🔒 จองโดย ${esc(r.by)} · เหลือ ${r.left} วัน</span>`;
  if(r.state==="closed") return `<span class="tag t-ok">✅ ปิดการขายแล้ว (${esc(r.by)})</span>`;
  return ""; }
function rsvTotal(){ return Object.keys(RSV).filter(k=>S.units[k]&&(rsvOf(k)||{}).state==="active").length; }
function rsvCount(us){ let a=0,c=0; us.forEach(u=>{const r=rsvOf(u._id); if(r&&r.state==="active")a++; if(r&&r.state==="closed")c++;}); return {a,c,free:us.length-a-c}; }
function rsvBox(u){ const r=rsvOf(u._id);
  const rule=`<div class="note" style="margin-top:8px">กติกา: จองได้ครั้งละ ${RSV_DAYS} วัน — ถ้ายังปิดการขายไม่ได้ ระบบปลดการจองให้อัตโนมัติ รถกลับมาว่างให้เซลล์คนอื่น</div>`;
  if(r&&r.state==="active") return `<div class="box" style="border-color:rgba(214,178,94,.55)"><h3>🔒 รถคันนี้ถูกจองแล้ว</h3>
    <div class="spec"><div class="k">เซลล์ผู้จอง</div><div class="v">${esc(r.by)}</div><div class="k">ลูกค้า</div><div class="v">${esc(r.cust||"—")}</div>
    <div class="k">จองเมื่อ</div><div class="v">${dTH(r.at)}</div><div class="k">หมดอายุ</div><div class="v"><b style="color:${r.left<=1?"var(--bad)":"#e6c77a"}">${dTH(r.exp)} (เหลือ ${r.left} วัน)</b></div></div>
    <div class="uact" style="margin-top:10px"><button class="btn pri sm" data-rsv="close">✅ ปิดการขายได้แล้ว</button><button class="btn sm" data-rsv="cancel">ยกเลิกการจอง</button></div>${rule}</div>`;
  if(r&&r.state==="closed") return `<div class="box"><h3>✅ ปิดการขายแล้ว</h3><div class="note">โดย ${esc(r.by)} · ลูกค้า ${esc(r.cust||"—")} — รอบัญชีออก PO แล้วรถจะย้ายไปกลุ่ม "มี PO แล้ว"</div><div class="uact" style="margin-top:8px"><button class="btn sm" data-rsv="cancel">ล้าง (เดโม)</button></div></div>`;
  const exp = r&&r.state==="expired" ? `<div class="note" style="color:var(--warn);margin-bottom:8px">⏰ การจองของ ${esc(r.by)} ครบ ${RSV_DAYS} วันแล้ว ปิดการขายไม่ทัน — ระบบปลดการจองให้แล้ว รถคันนี้ว่าง</div>`:"";
  if(u.status==="sold") return "";
  return `<div class="box"><h3>จองรถคันนี้</h3>${exp}
    <div class="uact" style="flex-wrap:wrap;gap:8px"><input class="inp" id="rsvBy" style="flex:1;min-width:140px" placeholder="ชื่อเซลล์ผู้จอง"><input class="inp" id="rsvCust" style="flex:1;min-width:140px" placeholder="ชื่อลูกค้า / หน่วยงาน">
    <button class="btn gold" data-rsv="make">🔒 จองคันนี้ ${RSV_DAYS} วัน</button></div>${rule}</div>`;
}
let rsvBusy=false;
async function rsvCall(params){ const q=new URLSearchParams(params).toString(); const r=await fetch(RSV_API+"?"+q,{cache:"no-store"}); return r.json(); }
function rsvApply(d){ if(d&&d.rsv){ RSV=d.rsv; if(S.loaded){ renderHead(); renderGrid(); if(S.open&&!document.activeElement?.closest?.("#sheet input")) renderSheet(); } } }
async function rsvPull(){ if(!RSV_API.startsWith("http")||rsvBusy) return; try{ rsvApply(await rsvCall({a:"list"})); }catch(e){ console.warn(e); } }
if(RSV_API.startsWith("http")){ setTimeout(rsvPull,300); setInterval(rsvPull,15000); document.addEventListener("visibilitychange",()=>{ if(!document.hidden) rsvPull(); }); }
document.addEventListener("click",async e=>{ const t=e.target.closest("[data-rsv]"); if(!t) return; const id=S.unit; if(!id) return; const a=t.dataset.rsv;
  let by="",cust="";
  if(a==="make"){ by=($("#rsvBy").value||"").trim(); cust=($("#rsvCust").value||"").trim(); if(!by){ toast("กรอกชื่อเซลล์ก่อนจอง",true); $("#rsvBy").focus(); return; } }
  if(RSV_API.startsWith("http")){
    rsvBusy=true; t.disabled=true; t.textContent="กำลังบันทึก…";
    try{ const d=await rsvCall({a,id,by,cust}); rsvBusy=false; if(!d.ok&&d.msg==="taken"){ toast("รถคันนี้เพิ่งถูกเซลล์คนอื่นจองไปแล้ว",true); } else toast(a==="make"?"จองแล้ว — ทุกคนเห็นทันที":a==="close"?"บันทึกปิดการขายแล้ว":"ยกเลิกการจองแล้ว"); rsvApply(d); renderSheet(); }
    catch(err){ rsvBusy=false; console.error(err); toast("เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง",true); renderSheet(); }
    return; }
  if(a==="make"){ const now=Date.now(); RSV[id]={by,cust,at:now,exp:now+RSV_DAYS*DAY}; toast("จองแล้ว — หมดอายุ "+dTH(RSV[id].exp)); }
  if(a==="cancel"){ delete RSV[id]; toast("ยกเลิกการจองแล้ว"); }
  if(a==="close"){ RSV[id]={...RSV[id],closed:true}; toast("บันทึกปิดการขายแล้ว"); }
  saveRsv(); renderHead(); renderSheet(); renderGrid(); });

function unitCard(u,m){
  const ps=photoList(u), offer=u.offer||offerOf(m), defs=(u.defects||[]).filter(d=>!d.fixed);
  const sp=n(u.salePrice)?baht(u.salePrice):"";
  return `<div class="unit" data-unit="${esc(u._id)}" style="cursor:pointer">

async function resize(file){
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600/Math.max(bmp.width,bmp.height));
    const c = document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.82));
  }catch(_){ return file; }
}
let pickCb=null;
function pickFiles(cb){ if(!S.assets){ toast("บัญชีนี้อัปโหลดรูปไม่ได้ (ต้องเป็น Contributor ขึ้นไป)",true); return; } pickCb=cb; const f=$("#fileIn"); f.value=""; f.click(); }
$("#fileIn").addEventListener("change", async e=>{
  const files=[...e.target.files]; if(!files.length||!pickCb) return;
  const cb=pickCb; pickCb=null; const ids=[];
  for (let i=0;i<files.length;i++){
    toast(`กำลังอัปโหลดรูป ${i+1}/${files.length}…`);
    try{ const b=await resize(files[i]); const r=await S.assets.upload(b); ids.push(r.id); }catch(err){ console.error(err); toast("อัปโหลดรูปไม่สำเร็จ",true); }
  }
  if (ids.length){ try{ await cb(ids); toast(`เพิ่มรูปแล้ว ${ids.length} รูป`); }catch(err){ dbErr(err); } }
});

// --- events
document.addEventListener("click", async e=>{
  const t=e.target.closest("[data-act],[data-open],[data-cat],[data-offer],[data-sort],[data-r],[data-lb],[data-unit]");
  if(!t) return;
  if (t.dataset.unit && !e.target.closest("[data-act],[data-lb]")){ S.unit=t.dataset.unit; S.editing=null; renderSheet(); $("#sheet").scrollTop=0; return; }
  if (t.dataset.r){ S.role=t.dataset.r; document.querySelectorAll("#roles button").forEach(b=>b.classList.toggle("on",b===t)); render(); return; }
  if (t.dataset.cat){ S.cat=t.dataset.cat; render(); return; }
  if (t.dataset.offer){ S.offer=t.dataset.offer; render(); return; }
  if (t.dataset.sort){ S.sort=t.dataset.sort; render(); return; }
  if (t.dataset.open){ openModel(t.dataset.open); return; }
  if (t.dataset.lb && !t.dataset.act){ $("#lbimg").src=img(t.dataset.lb); $("#lb").classList.add("on"); return; }
  const a=t.dataset.act, m=S.models[S.open], col=S.db&&S.db.collection("models");
  try{
  switch(a){
    case "close": closeSheet(); break;
    case "present": present(S.open); break;
    case "pclose": $("#pres").classList.remove("on"); break;
    case "pprev": P.i=(P.i-1+P.list.length)%P.list.length; renderPres(); break;
    case "pclose2": break;
    case "pnext": P.i=(P.i+1)%P.list.length; renderPres(); break;
    case "savePrice":

});
